<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моделирование потока событий</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Моделирование запросов на сервер</h1>
        
        <div class="controls">
            <div class="input-group">
                <label>Интенсивность (&lambda;):</label>
                <input type="number" id="lambda" value="5" step="0.1">
            </div>
            <div class="input-group">
                <label>Интервал времени (T):</label>
                <input type="number" id="timeT" value="10">
            </div>
            <div class="input-group">
                <label>Кол-во измерений (N):</label>
                <input type="number" id="numExp" value="1000">
            </div>
            <div class="input-group">
                <label>Общее время (T_total):</label>
                <input type="number" id="T_total" value="10000">
            </div>
            <button id="runBtn">Запустить моделирование</button>
        </div>

        <div class="results">
            <div class="stats">
                <p>Среднее: <span id="mean">-</span></p>
                <p>Дисперсия: <span id="variance">-</span></p>
            
            </div>
            <div class="chart-container">
                <canvas id="distributionChart"></canvas>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script src="{{ url_for('static', filename='script.js') }}"></script> 
        </div> 
    </div>
</body>
</html>
